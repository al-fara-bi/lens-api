# Local / reviewer setup: the API alone, reachable on http://localhost:8000.
# Production adds TLS via docker-compose.prod.yml.
services:
  app:
    build: .
    container_name: lens-api
    env_file:
      - path: .env
        required: true
      # Written by scripts/deploy.sh from the git tag. Kept separate from .env
      # so the version survives a manual `docker compose up` on the server —
      # relying on an exported shell variable silently reset it to 'dev'.
      - path: .env.version
        required: false
    ports:
      - "8000:8000"
    volumes:
      # Named volume, not a bind mount: the SQLite database, request logs and
      # rate-limit state survive `docker compose down` and image rebuilds.
      - api-data:/app/data
    restart: unless-stopped

volumes:
  api-data:
