# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy terminates TLS and proxies to the app. The app's own port is no longer
# published, so the only way in is through the proxy — which is what makes
# trusting X-Forwarded-For safe.
services:
  app:
    ports: !override []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  caddy:
    image: caddy:2-alpine
    container_name: landing-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume Caddy re-requests them on
      # every restart and hits Let's Encrypt's rate limit (5 per domain per week).
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
